name: Build Windows ZIP

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pystray pillow pywin32

      - name: Ensure icons exist (generate if missing)
        shell: pwsh
        run: |
          python - << 'PY'
          import os
          from PIL import Image

          os.makedirs("icons", exist_ok=True)

          def make_icon(rgb, path):
              img = Image.new("RGBA", (64, 64), (0, 0, 0, 0))
              cx, cy, r = 32, 32, 28
              for y in range(64):
                  for x in range(64):
                      dx, dy = x - cx, y - cy
                      if dx*dx + dy*dy <= r*r:
                          img.putpixel((x, y), (*rgb, 255))
              img.save(path, format="ICO", sizes=[(16,16), (32,32), (48,48), (64,64)])

          green = os.path.join("icons", "green.ico")
          red = os.path.join("icons", "red.ico")

          if not os.path.exists(green):
              make_icon((0, 180, 0), green)
          if not os.path.exists(red):
              make_icon((200, 0, 0), red)

          print("Icons ready:", os.listdir("icons"))
          PY

      - name: Build EXE (PyInstaller)
        shell: pwsh
        run: |
          python -m PyInstaller --onefile --noconsole --name PingMonitor `
            --add-data "config.example.json;." `
            --add-data "icons;icons" `
            --collect-submodules pystray `
            monitor.py

      - name: Prepare release folder
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Move-Item "dist\PingMonitor.exe" "release\PingMonitor.exe"
          Copy-Item "config.example.json" "release\config.example.json"
          New-Item -ItemType Directory -Force "release\icons" | Out-Null
          Copy-Item "icons\*" "release\icons" -Recurse -Force

      - name: Create README.txt
        shell: pwsh
        run: |
          $text = @(
            "Ping Monitor Tray App",
            "",
            "1) Edit config.example.json",
            "2) Rename it to config.json (must be next to PingMonitor.exe)",
            "3) Run PingMonitor.exe"
          ) -join "`r`n"
          $text | Set-Content -Encoding UTF8 "release\README.txt"

      - name: Zip release
        shell: pwsh
        run: |
          if (Test-Path "PingMonitor.zip") { Remove-Item "PingMonitor.zip" -Force }
          Compress-Archive -Path "release\*" -DestinationPath "PingMonitor.zip"

      - name: Upload ZIP to Release
        uses: softprops/action-gh-release@v2
        with:
          files: PingMonitor.zip
