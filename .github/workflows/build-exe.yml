name: Build Windows ZIP

on:
  release:
    types: [created]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pystray pillow

      - name: Build EXE
        run: |
          pyinstaller --onefile --noconsole `
            --add-data "config.example.json;." `
            --add-data "icons;icons" `
            monitor.py

      - name: Prepare release folder
        run: |
          mkdir release
          move dist\monitor.exe release\PingMonitor.exe
          copy config.example.json release\
          xcopy icons release\icons /E /I

      - name: Create README.txt
        run: |
          echo Ping Monitor Tray App > release\README.txt
          echo. >> release\README.txt
          echo 1. Edit config.example.json >> release\README.txt
          echo 2. Rename to config.json >> release\README.txt
          echo 3. Run PingMonitor.exe >> release\README.txt

      - name: Zip release
        run: |
          powershell Compress-Archive -Path release\* -DestinationPath PingMonitor.zip

      - name: Upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          files: PingMonitor.zip
